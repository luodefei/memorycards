server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: memorycards-server
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:sqlite:${DB_FILE:memorycards.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      connection-init-sql: PRAGMA busy_timeout = 5000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

app:
  jwt:
    secret: ${JWT_SECRET:memorycards-local-dev-secret-key-please-change-in-prod}
    expiration-hours: ${JWT_EXPIRATION_HOURS:168}
  research:
    shim-url: ${RESEARCH_SHIM_URL:http://127.0.0.1:8318}
    model: ${RESEARCH_MODEL:DeepSeek-V4-Flash}
    max-tokens: ${RESEARCH_MAX_TOKENS:4096}
    timeout-seconds: ${RESEARCH_TIMEOUT_SECONDS:120}